services:
  postgres:
    image: postgres:16-alpine
    container_name: hotel-review-ai-postgres
    environment:
      POSTGRES_DB: hotel_review_ai
      POSTGRES_USER: hotel_review_ai
      POSTGRES_PASSWORD: hotel_review_ai_dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - hotel_review_ai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel_review_ai -d hotel_review_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hotel_review_ai_postgres_data:
